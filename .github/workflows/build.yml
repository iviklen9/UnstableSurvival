
name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find plugin ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "FEHLER: Keine ZIP-Datei im Repository gefunden!"
            ls -la
            exit 1
          fi

          echo "ZIP gefunden: $ZIP"

      - name: Extract plugin ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Maven project
        run: |
          POM=$(find extracted -type f -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml gefunden!"
            find extracted -maxdepth 8 -type f
            exit 1
          fi

          echo "POM=$POM" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

          echo "Maven-Projekt gefunden: $POM"

      - name: Check plugin.yml
        run: |
          PLUGIN_YML=$(find "$PROJECT_DIR" -type f -name plugin.yml -print -quit)

          if [ -z "$PLUGIN_YML" ]; then
            echo "FEHLER: plugin.yml wurde nicht gefunden!"
            exit 1
          fi

          echo "plugin.yml gefunden: $PLUGIN_YML"

      - name: Compile plugin
        run: mvn -B -f "$POM" clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: UnstableSurvival-JAR
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          if-no-files-found: error
