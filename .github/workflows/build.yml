
name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        - uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract plugin ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "FEHLER: Keine ZIP-Datei gefunden!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "ZIP gefunden: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Maven project
        id: project
        run: |
          POM=$(find extracted -type f \
            -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml in der ZIP!"
            find extracted -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Maven-Projekt gefunden: $POM"

      - name: Check plugin files
        run: |
          DIR="${{ steps.project.outputs.project_dir }}"
          test -f "$DIR/src/main/resources/plugin.yml"

      - name: Build plugin
        run: |
          mvn -f "${{ steps.project.outputs.project_dir }}/pom.xml" clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSurvival-JAR
          path: ${{ steps.project.outputs.project_dir }}/target/*.jar
          if-no-files-found: error
