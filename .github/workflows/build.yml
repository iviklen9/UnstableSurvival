
name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip -q UnstableSurvival-Source.zip -d extracted

      - name: Show error line
        run: |
          sed -n '126p' extracted/UnstableSurvival/src/main/java/de/unstable/survival/UnstableSurvival.java

      - name: Find project and compile
        run: |
          POM=$(find extracted -type f -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml in der ZIP gefunden!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$POM")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          mvn -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSurvival-JAR
          path: ${{ env.PROJECT_DIR }}/target/*.jar

