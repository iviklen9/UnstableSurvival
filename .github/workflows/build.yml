
name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Maven project
        id: project
        shell: bash
        run: |
          if [ -f "pom.xml" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

            if [ -z "$ZIP" ]; then
              echo "FEHLER: Keine pom.xml und keine ZIP gefunden!"
              ls -la
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            POM=$(find extracted -type f -name pom.xml -print -quit)

            if [ -z "$POM" ]; then
              echo "FEHLER: Keine pom.xml in der ZIP gefunden!"
              find extracted -maxdepth 5 -type f
              exit 1
            fi

            echo "project_dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"
          fi

      - name: Check plugin files
        run: |
          DIR="${{ steps.project.outputs.project_dir }}"

          test -f "$DIR/pom.xml"
          test -f "$DIR/src/main/resources/plugin.yml"

          echo "Projektdateien gefunden."

      - name: Build and test plugin
        run: |
          mvn -f "${{ steps.project.outputs.project_dir }}/pom.xml" clean verify

      - name: Upload UnstableSurvival JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSurvival-JAR
          path: ${{ steps.project.outputs.project_dir }}/target/*.jar
          if-no-files-found: error
