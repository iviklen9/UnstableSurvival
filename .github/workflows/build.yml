
name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract plugin ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "FEHLER: Keine ZIP-Datei im Repository gefunden!"
            ls -la
            exit 1
          fi
          echo "ZIP gefunden: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Java source
        run: |
          JAVA_FILE=$(find extracted -type f -name UnstableSurvival.java -print -quit)
          if [ -z "$JAVA_FILE" ]; then
            echo "FEHLER: UnstableSurvival.java wurde nicht gefunden!"
            find extracted -maxdepth 8 -type f
            exit 1
          fi
          echo "Java-Datei gefunden: $JAVA_FILE"
          nl -ba "$JAVA_FILE" | sed -n '120,130p'

      - name: Find Maven project
        run: |
          POM=$(find extracted -type f -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml gefunden!"
            find extracted -maxdepth 8 -type f
            exit 1
          fi
          echo "POM=$POM" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"
          echo "Maven-Projekt gefunden: $POM"

      - name: Compile plugin
        run: mvn -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSurvival-JAR
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          if-no-files-found: error

