name: Build UnstableSurvival

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract ZIP
        run: unzip UnstableSurvival-Source.zip -d .

      - name: Compile plugin
        run: mvn -f UnstableSurvival/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSurvival
          path: UnstableSurvival/target/*.jar
